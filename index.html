<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vante — Dashboard de Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="login-screen">
    <div class="login-logo">Vante</div>

    <div class="login-card">
      <div class="login-card-title">
        <!-- Lock icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Acesso restrito
      </div>

      <div class="input-wrap">
        <input
          id="login-input"
          type="password"
          placeholder="Senha de acesso"
          autocomplete="current-password"
        />
        <button class="eye-btn" id="eye-btn" aria-label="Mostrar senha" type="button">
          <!-- Eye icon (show) -->
          <svg id="eye-icon-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye-off icon (hide) — hidden by default -->
          <svg id="eye-icon-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <div class="login-error" id="login-error">Senha incorreta. Tente novamente.</div>

      <button class="btn-login" id="btn-login">Entrar</button>
    </div>

    <div class="login-footer">Vante &middot; Dashboard Interno</div>
  </div><!-- /#login-screen -->


  <!-- ===================== APP SCREEN ===================== -->
  <div id="app-screen">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        Vante
        <span>Dashboard de Estudos</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Menu</div>

        <button class="nav-item active" data-view="estudos">
          <!-- BookOpen icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Meus Estudos
        </button>

        <button class="nav-item" data-view="home">
          <!-- Home icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Home
        </button>

        <button class="nav-item" data-view="suporte">
          <!-- LifeBuoy icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
            <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
            <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/>
            <line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/>
          </svg>
          Suporte
        </button>

        <div class="sidebar-spacer"></div>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">V</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Estudante</div>
          <div class="user-role">Membro Vante</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">
          <!-- LogOut icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside><!-- /.sidebar -->


    <!-- MAIN CONTENT -->
    <div class="main-content">

      <!-- TOP BAR -->
      <header class="topbar">
        <span class="topbar-title" id="topbar-title">Meus Estudos</span>
        <div style="display:flex;align-items:center;gap:.75rem;">
          <!-- Hamburger (mobile) -->
          <button id="hamburger" style="display:none;background:none;border:none;cursor:pointer;color:var(--text-dim);padding:.25rem;"
                  aria-label="Abrir menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- GLOBAL PROGRESS STRIP -->
      <div class="progress-strip">
        <span class="prog-label">Progresso geral</span>
        <span class="prog-count" id="global-count">0 / 0</span>
        <div class="prog-bar-wrap">
          <div class="prog-bar-fill" id="global-bar" style="width:0%"></div>
        </div>
        <span class="prog-pct" id="global-pct">0%</span>
      </div>

      <!-- SUBJECT TABS -->
      <div class="subject-tabs" id="subject-tabs">
        <button class="subject-tab active" data-subject="trafego">
          <!-- TrendingUp icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
          Tráfego Pago
          <span class="tab-count" id="tab-count-trafego">0</span>
        </button>
        <button class="subject-tab" data-subject="design">
          <!-- Palette icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
          </svg>
          Design Gráfico
          <span class="tab-count" id="tab-count-design">0</span>
        </button>
      </div>

      <!-- CONTENT AREA -->
      <div class="content-area">
        <div class="tab-content active" id="tab-trafego">
          <div id="tp-content"><!-- rendered by app.js --></div>
        </div>
        <div class="tab-content" id="tab-design">
          <div id="dg-content"><!-- rendered by app.js --></div>
        </div>
      </div>

    </div><!-- /.main-content -->

  </div><!-- /#app-screen -->

  <script src="app.js" defer></script>
</body>
</html>
